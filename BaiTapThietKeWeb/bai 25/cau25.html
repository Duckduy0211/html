<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tính tiền các món ăn</title>
    <style>
        .menu {
            width: 520px;
            max-width: 100%;
            border: 2px solid #1688a0;
            background: #ccff00;
            text-align: center;
        }

        .luaChon {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px;
        }

        select {
            width: 180px;
            height: 150px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #9ff5f5;
            text-align: left;
        }

        th, td {
            border: 1px solid #1688a0;
            padding: 4px;
        }

        button {
            margin: 8px;
        }
    </style>
</head>
<body>
    <div class="menu">
        <h3>THỰC ĐƠN</h3>

        <div class="luaChon">
            <div>
                <strong>Thức ăn</strong><br>
                <select id="thucAn" multiple>
                    <option value="35000">Bún bò</option>
                    <option value="35000">Hủ tiếu</option>
                    <option value="35000">Bánh canh</option>
                    <option value="40000">Phở bò</option>
                    <option value="25000">Nui</option>
                    <option value="20000">Bánh mì thịt</option>
                    <option value="25000">Bánh cuốn</option>
                </select>
            </div>

            <div>
                <strong>Nước uống</strong><br>
                <select id="nuocUong" multiple>
                    <option value="12000">Cà phê đá</option>
                    <option value="15000">Cà phê sữa đá</option>
                    <option value="13000">Chanh dây</option>
                    <option value="12000">Chanh muối</option>
                    <option value="14000">Xí muội</option>
                    <option value="13000">Sữa tươi</option>
                    <option value="17000">Cam vắt</option>
                </select>
            </div>

            <div>
                <strong>Thời điểm</strong><br>
                <label><input type="radio" name="thoiDiem" value="ngay" checked> Ban ngày</label><br>
                <label><input type="radio" name="thoiDiem" value="dem"> Ban đêm</label>
            </div>
        </div>

        <button type="button" onclick="tinhTien()">Tính tiền</button>

        <table>
            <thead>
                <tr>
                    <th>Các món đã dùng</th>
                    <th>Tiền</th>
                </tr>
            </thead>
            <tbody id="danhSachMon"></tbody>
            <tfoot>
                <tr>
                    <th>Tổng tiền</th>
                    <th id="tongTien">0 đồng</th>
                </tr>
            </tfoot>
        </table>
    </div>

    <script>
        function tinhTien() {
            const danhSachMon = document.getElementById("danhSachMon");
            const tongTienHienThi = document.getElementById("tongTien");
            const cacMon = [
                ...document.getElementById("thucAn").selectedOptions,
                ...document.getElementById("nuocUong").selectedOptions
            ];

            danhSachMon.innerHTML = "";
            let tongTien = 0;

            cacMon.forEach(function (mon) {
                const gia = Number(mon.value);
                tongTien += gia;

                const dong = document.createElement("tr");
                dong.innerHTML = `
                    <td>${mon.text}</td>
                    <td>${gia.toLocaleString("vi-VN")} đồng</td>
                `;
                danhSachMon.appendChild(dong);
            });

            const thoiDiem = document.querySelector('input[name="thoiDiem"]:checked').value;
            if (thoiDiem === "dem") {
                tongTien *= 1.1;
            }

            tongTienHienThi.textContent = `${tongTien.toLocaleString("vi-VN")} đồng`;
        }
    </script>
</body>
</html>
