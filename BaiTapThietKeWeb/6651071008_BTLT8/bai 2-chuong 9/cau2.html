<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Return first and last name from a form - jQuery</title>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<form id="form1" onsubmit="getFormvalue(event)">
First name: <input type="text" name="fname" value="David"><br>
Last name: <input type="text" name="lname" value="Beckham"><br>
<input type="submit" value="Submit">
</form>

<script>
function getFormvalue(event) {
    // Ngăn chặn form submit lại trang
    event.preventDefault();
    
    // Sử dụng jQuery để lấy giá trị dựa vào thuộc tính name
    var firstName = $('input[name="fname"]').val();
    var lastName = $('input[name="lname"]').val();
    
    alert("Họ và tên: " + firstName + " " + lastName);
    console.log(firstName);
    console.log(lastName);
}
</script>
</body>
</html>
