<!DOCTYPE html>
<html>
<head>
<style type="text/css">
body {margin: 30px;}
</style>
<meta charset="utf-8" />
<title>Remove items from a dropdown list - jQuery</title>
<!-- Thêm thư viện jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<form>
<select id="colorSelect">
<option>Red</option>
<option>Green</option>
<option>White</option>
<option>Black</option>
</select>
<input type="button" onclick="removecolor()" value="Select and Remove">
</form>

<script>
function removecolor() {
    // Sử dụng jQuery để tìm option đang được chọn và xóa nó
    $('#colorSelect option:selected').remove();
}
</script>
</body>
</html>
